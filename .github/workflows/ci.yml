name: Wildtype CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Ecosystem Checks
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      VERCEL_ENV: preview

    steps:
      - name: Checkout Apex
        uses: actions/checkout@v4
        with:
          path: Apex

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Apex/package-lock.json

      - name: Install Apex Dependencies
        working-directory: Apex
        run: npm ci

      - name: Build Apex
        working-directory: Apex
        run: npm run build

      - name: Checkout Spoke Modules (when DB secrets are configured)
        if: ${{ env.MONGODB_URI != '' && env.JWT_SECRET != '' }}
        run: |
          for repo in Circa Dispo LabProject Locus Pulsus Silo; do
            git clone --depth 1 --branch "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY_OWNER}/${repo}.git" "${repo}" \
              || git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/${repo}.git" "${repo}"
            (cd "${repo}" && npm ci)
          done

      - name: Run Ecosystem API & RBAC Tests (*_test_db)
        if: ${{ env.MONGODB_URI != '' && env.JWT_SECRET != '' }}
        working-directory: Apex
        run: npm run test:api
